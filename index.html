<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>המשימות שלי</title>
<style>
  :root{
    --bg:#0b0b0f; --card:#15151c; --card2:#1b1b24; --line:#2a2a36;
    --text:#f2f2f7; --muted:#9a9aab; --accent:#8B5CF6; --accent-soft:rgba(139,92,246,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{
    font-family:"Heebo","Rubik","IBM Plex Sans Hebrew","Assistant","Segoe UI","Arial Hebrew",
      -apple-system,BlinkMacSystemFont,"Noto Sans Hebrew",Roboto,Arial,sans-serif;
    font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:720px;margin:0 auto;padding:22px 16px 48px}
  header{margin-bottom:18px}
  h1{font-size:30px;line-height:1.2;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
  h1 .dot{color:var(--accent)}
  .sub{color:var(--muted);font-size:15px;margin:0 0 14px}
  .progress{display:flex;align-items:center;gap:12px}
  .bar{flex:1;height:10px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a78bfa,var(--accent));border-radius:99px;transition:width .35s ease}
  .count{font-size:15px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .count b{color:var(--text)}

  .status{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
  .pill{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:9px 12px;font-size:14px;line-height:1.35}
  .pill b{font-weight:700;font-size:15px}
  .pill span{grid-column:2;color:var(--muted)}
  .pill::before{content:"";grid-row:1;width:8px;height:8px;border-radius:50%;background:var(--c,#666)}
  @media (min-width:900px){ .status{grid-template-columns:repeat(4,1fr)} }

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 16px 8px;margin:0 0 14px}
  .card h2{font-size:20px;margin:0 0 6px;font-weight:700;display:flex;align-items:center;gap:8px}
  .card h2 .n{margin-inline-start:auto;font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
  .card.hot{border-color:var(--accent);background:linear-gradient(180deg,rgba(139,92,246,.18),rgba(139,92,246,.05) 60%),var(--card);
    box-shadow:0 0 0 1px rgba(139,92,246,.25),0 10px 30px -12px rgba(139,92,246,.55)}
  .card.hot h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

  ul{list-style:none;margin:0;padding:0}
  li+li{border-top:1px solid var(--line)}
  label.task{display:flex;align-items:flex-start;gap:14px;padding:14px 2px;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:56px}
  label.task input{position:absolute;opacity:0;pointer-events:none}
  .box{flex:0 0 30px;width:30px;height:30px;border-radius:9px;border:2px solid #4a4a5c;display:grid;place-items:center;transition:.15s;margin-top:-1px}
  .box svg{width:18px;height:18px;opacity:0;transform:scale(.6);transition:.15s}
  label.task input:checked + .box{background:var(--accent);border-color:var(--accent)}
  label.task input:checked + .box svg{opacity:1;transform:none}
  label.task input:focus-visible + .box{outline:3px solid rgba(139,92,246,.6);outline-offset:2px}
  .txt{flex:1;font-size:18px}
  .txt small{display:block;color:var(--muted);font-size:15px;margin-top:2px}
  label.task input:checked ~ .txt{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.45);color:var(--muted)}

  details.card{padding-bottom:12px;opacity:.6}
  details.card[open]{padding-bottom:8px}
  details summary{list-style:none;cursor:pointer;font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;min-height:32px}
  details summary::-webkit-details-marker{display:none}
  details summary .chev{transition:transform .2s;color:var(--muted)}
  details[open] summary .chev{transform:rotate(-90deg)}
  details summary .n{margin-inline-start:auto;font-size:13px;font-weight:500;color:var(--muted)}
  details ul{margin-top:6px}
  footer{color:var(--muted);font-size:13px;text-align:center;margin-top:22px}
  @media (min-width:900px){
    .wrap{max-width:1100px;padding-top:40px}
    h1{font-size:38px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
    .grid .card{margin:0}
    .grid .hot,.grid details.card{grid-column:1/-1}
  }

  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:0 0 16px}
  .tabs[hidden]{display:none}
  .tabs button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:16px;font-weight:600;
    padding:9px 6px;border-radius:10px;cursor:pointer;min-height:42px;-webkit-tap-highlight-color:transparent}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
  .tabs button:focus-visible{outline:3px solid rgba(139,92,246,.6);outline-offset:2px}
  .track{margin:0 0 10px}
  .track+.track{border-top:1px solid var(--line);margin-top:18px}
  .track-h{display:flex;align-items:baseline;gap:10px;font-size:24px;font-weight:800;margin:22px 0 12px}
  .track-h:first-child{margin-top:4px}
  .track-h small{font-size:14px;font-weight:500;color:var(--muted)}
  .track-h .n{margin-inline-start:auto;font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>המשימות שלי <span class="dot">·</span> <span id="viewTitle">סושיאל</span></h1>
    <p class="sub">עודכן: <bdi dir="ltr" id="updated">…</bdi></p>
    <div class="progress" aria-label="התקדמות">
      <div class="bar"><i id="barFill"></i></div>
      <div class="count" id="count"></div>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="תצוגה" hidden>
    <button role="tab" data-view="social" aria-selected="false">סושיאל</button>
    <button role="tab" data-view="dev" aria-selected="false">פיתוח</button>
    <button role="tab" data-view="all" aria-selected="true">הכול</button>
  </nav>
  <main id="tracks"><div class="msg">טוען…</div></main>
  <footer>הסימונים נשמרים במכשיר הזה</footer>
</div>

<script>
/* הנתונים נטענים מ-tasks.json (ראו AGENTS.md). אין לערוך נתונים כאן. */
const KEY = "paul-social-tasks-v1";
let DATA = null;
let view = ["social","dev","all"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "all";

/* סימונים מקומיים של פול = דריסות מעל done שב-JSON.
   פורמט חדש: {v:bool, base:bool} — base הוא ערך done ב-JSON ברגע הסימון.
   אם הסוכן שינה את done מאז, הדריסה מתבטלת וה-JSON קובע. ערך בוליאני ישן נשמר כמו שהוא. */
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };
const isDone = t => {
  const o = state[t.id], base = !!t.done;
  if (o === undefined) return base;
  if (typeof o === "boolean") return o;
  if (o && typeof o === "object" && o.base === base) return !!o.v;
  return base;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* טקסט לתצוגה: מבודד מספרים/טווחים (4–6, תאריכים) כדי שיוצגו נכון ב-RTL */
const txt = s => esc(s).replace(/(\d+(?:[–\-.:,]\s?\d+)+)/g, '<bdi dir="ltr">$1</bdi>');
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const safeColor = c => /^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]+$/.test(c||"") ? c : "#666";

function fmtUpdated(iso){
  const d = new Date(iso);
  if (isNaN(d)) return iso ? String(iso) : "—";
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", {timeZone:"Asia/Jerusalem",
    day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit", hourCycle:"h23"})
    .formatToParts(d).map(x => [x.type, x.value]));
  return `${p.day}.${p.month}.${p.year} ${p.hour}:${p.minute}`;
}

function taskHTML(t){
  return `<li><label class="task"><input type="checkbox" data-id="${esc(t.id)}" data-base="${t.done?1:0}" ${isDone(t)?"checked":""}>
    <span class="box">${CHECK}</span>
    <span class="txt">${txt(t.text)}${t.note?`<small>${txt(t.note)}</small>`:""}</span></label></li>`;
}
function sectionHTML(tr, s){
  const sid = `${tr.id}-${s.id}`;
  const list = `<ul>${(s.tasks||[]).map(taskHTML).join("")}</ul>`;
  const n = `<span class="n" data-sec="${esc(sid)}"></span>`;
  if (s.collapsed) return `<details class="card" id="sec-${esc(sid)}"><summary><span class="chev">‹</span>${txt(s.title)}${n}</summary>${list}</details>`;
  return `<section class="card${s.highlight?" hot":""}" id="sec-${esc(sid)}"><h2>${txt(s.title)}${n}</h2>${list}</section>`;
}
const visibleTracks = () => (DATA.tracks||[]).filter(tr => view === "all" || tr.id === view);

/* מסלול אחד בלבד: בלי טאבים ובלי כותרת מסלול, כמו הרשימה המקורית */
const isSingle = () => !DATA || (DATA.tracks||[]).length <= 1;
function render(){
  const single = isSingle();
  if (single) view = "all";
  document.querySelector(".tabs").hidden = single;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  const tabBtn = document.querySelector(`.tabs button[data-view="${view}"]`);
  const only = DATA && (DATA.tracks||[]).length === 1 ? DATA.tracks[0].title : "סושיאל";
  document.getElementById("viewTitle").textContent = single ? only : (tabBtn ? tabBtn.textContent : "");
  if (!DATA) return;
  document.getElementById("updated").textContent = fmtUpdated(DATA.updated);
  const pills = (DATA.episodes||[]).length ? `<nav class="status" aria-label="סטטוס פרקים">${DATA.episodes.map(e =>
    `<div class="pill" style="--c:${safeColor(e.color)}"><b>${txt(e.label)}</b><span>${txt(e.status)}</span></div>`).join("")}</nav>` : "";
  const trs = visibleTracks();
  document.getElementById("tracks").innerHTML = trs.map(tr => `<div class="track" id="track-${esc(tr.id)}">
      ${view === "all" && !isSingle() ? `<h2 class="track-h">${txt(tr.title)}${tr.owner?`<small>${txt(tr.owner)}</small>`:""}<span class="n" data-track="${esc(tr.id)}"></span></h2>` : ""}
      ${tr.id === "social" ? pills : ""}
      <div class="grid">${(tr.sections||[]).map(s => sectionHTML(tr, s)).join("")}</div>
    </div>`).join("") || `<div class="msg">אין משימות</div>`;
  update();
}
function update(){
  if (!DATA) return;
  const trs = visibleTracks();
  const all = trs.flatMap(tr => (tr.sections||[]).flatMap(s => s.tasks||[]));
  const done = all.filter(isDone).length;
  document.getElementById("barFill").style.width = (all.length ? done/all.length*100 : 0) + "%";
  document.getElementById("count").innerHTML = `<b>${done}</b> מתוך ${all.length} בוצעו`;
  trs.forEach(tr => {
    const tt = (tr.sections||[]).flatMap(s => s.tasks||[]);
    const te = document.querySelector(`[data-track="${tr.id}"]`);
    if (te) te.textContent = `${tt.filter(isDone).length}/${tt.length}`;
    (tr.sections||[]).forEach(s => {
      const el = document.querySelector(`[data-sec="${tr.id}-${s.id}"]`);
      const ts = s.tasks||[];
      if (el) el.textContent = `${ts.filter(isDone).length}/${ts.length}`;
    });
  });
}
document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (!id) return;
  const base = e.target.dataset.base === "1";
  if (e.target.checked === base) delete state[id];
  else state[id] = { v: e.target.checked, base };
  save();
  document.querySelectorAll(`input[data-id="${CSS.escape(id)}"]`).forEach(i => { if (i !== e.target) i.checked = e.target.checked; });
  update();
});
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if (!b) return;
  view = b.dataset.view;
  history.replaceState(null, "", view === "all" ? location.pathname + location.search : "#" + view);
  render();
});
fetch("tasks.json", {cache:"no-store"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { DATA = d; render(); })
  .catch(err => {
    document.getElementById("tracks").innerHTML = `<div class="msg">לא הצלחתי לטעון את המשימות (${esc(err.message)}). נסו לרענן.</div>`;
  });
render();
</script>
</body>
</html>
