<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<title>המשימות של פול · NIPO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#07080f; --bg2:#0b0d18; --card:#0f1220; --card2:#141829; --card3:#191e33;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
    --text:#eef0f8; --muted:#8b90a8; --dim:#5d6280;
    --accent:#8B5CF6; --accent2:#A78BFA; --accent-soft:rgba(139,92,246,.16);
    --green:#34d399; --violet:#d08cff; --orange:#fb923c; --blue:#60a5fa;
    --sans:"Heebo","Rubik","IBM Plex Sans Hebrew","Assistant","Segoe UI","Arial Hebrew",-apple-system,BlinkMacSystemFont,"Noto Sans Hebrew",Roboto,Arial,sans-serif;
    --serif:"Frank Ruhl Libre","David Libre","Noto Serif Hebrew","Taamey Frank CLM","David","Times New Roman",Georgia,serif;
    --tabbar:68px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.10),transparent 60%),var(--bg);min-height:100vh}
  bdi,.ltr{unicode-bidi:isolate;direction:ltr}
  button{font:inherit;color:inherit}
  svg{display:block}
  .ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- layout ---------- */
  .app{min-height:100vh}
  .side{padding:calc(14px + env(safe-area-inset-top)) 16px 0}
  .brand{display:flex;align-items:center;gap:10px}
  .orb{width:34px;height:34px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 34% 30%,#fff 0,#e9ddff 8%,#b69cff 24%,#8B5CF6 48%,#4c1d95 78%,#1e0b44 100%);
    box-shadow:0 0 18px 2px rgba(139,92,246,.55),0 0 42px 6px rgba(139,92,246,.18),inset -3px -4px 8px rgba(0,0,0,.35)}
  .brand b{font-weight:800;font-size:17px;letter-spacing:.01em}
  .brand b span{color:var(--accent2);font-weight:700;letter-spacing:.08em}
  .brand small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.05em;font-weight:600;margin-top:-2px}

  /* tiles: mobile = bottom tab bar */
  .tiles{position:fixed;inset:auto 0 0 0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(9,10,19,.88);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line2)}
  .tile{appearance:none;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;padding:6px 2px;border-radius:12px;cursor:pointer;min-height:54px;-webkit-tap-highlight-color:transparent;font-size:11px;font-weight:600;line-height:1.15;white-space:nowrap}
  .tile .ic{width:32px;height:28px;border-radius:10px;display:grid;place-items:center;transition:.15s}
  .tile .ic .ico{width:19px;height:19px}
  .tile[aria-current="true"]{color:#fff}
  .tile[aria-current="true"] .ic{background:var(--accent-soft);color:var(--accent2);box-shadow:inset 0 0 0 1px rgba(167,139,250,.35)}
  .tile:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}

  .main{padding:10px 16px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom));max-width:1180px}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 0 12px;
    background:linear-gradient(var(--bg) 70%,rgba(7,8,15,0))}
  .search{flex:1;position:relative}
  .search .ico{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--dim);width:18px;height:18px;pointer-events:none}
  .search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--text);
    font:inherit;font-size:16px;padding-inline:44px 14px;outline:none;transition:.15s;-webkit-appearance:none;appearance:none}
  .search input::placeholder{color:var(--dim)}
  .search input:focus{border-color:rgba(167,139,250,.6);box-shadow:0 0 0 4px rgba(139,92,246,.16)}
  .search input::-webkit-search-cancel-button{filter:invert(.6)}
  .upd{display:none;color:var(--muted);font-size:13px;white-space:nowrap}
  .upd bdi{color:var(--text)}

  /* ---------- cards ---------- */
  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px}
  .label{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:8px}
  .label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}

  /* hero */
  .hero{position:relative;overflow:hidden;padding:26px 20px 22px;margin-bottom:14px;
    background:radial-gradient(420px 220px at 12% 0%,rgba(139,92,246,.22),transparent 70%),
               radial-gradient(300px 200px at 100% 110%,rgba(167,139,250,.10),transparent 70%),
               linear-gradient(180deg,#111427,#0c0e1b)}
  .hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.9;
    background-image:
      radial-gradient(1.4px 1.4px at 8% 22%,#fff,transparent),radial-gradient(1px 1px at 16% 70%,#cfc3ff,transparent),
      radial-gradient(1.2px 1.2px at 24% 38%,#fff,transparent),radial-gradient(1px 1px at 31% 12%,#fff,transparent),
      radial-gradient(1.6px 1.6px at 38% 58%,#e4dcff,transparent),radial-gradient(1px 1px at 44% 84%,#fff,transparent),
      radial-gradient(1.2px 1.2px at 52% 26%,#fff,transparent),radial-gradient(1px 1px at 58% 66%,#bda9ff,transparent),
      radial-gradient(1.5px 1.5px at 64% 16%,#fff,transparent),radial-gradient(1px 1px at 70% 46%,#fff,transparent),
      radial-gradient(1.3px 1.3px at 76% 80%,#fff,transparent),radial-gradient(1px 1px at 82% 30%,#d9ceff,transparent),
      radial-gradient(1.7px 1.7px at 88% 62%,#fff,transparent),radial-gradient(1px 1px at 93% 14%,#fff,transparent),
      radial-gradient(1px 1px at 97% 88%,#fff,transparent),radial-gradient(1.2px 1.2px at 5% 90%,#fff,transparent),
      radial-gradient(1px 1px at 48% 8%,#fff,transparent),radial-gradient(1px 1px at 67% 92%,#cbbcff,transparent);
    -webkit-mask-image:linear-gradient(90deg,#000,rgba(0,0,0,.35));mask-image:linear-gradient(90deg,#000,rgba(0,0,0,.35))}
  .hero>*{position:relative}
  .date{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--accent2);margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .date::before{content:"";width:18px;height:1px;background:currentColor;opacity:.6}
  .hello{font-family:var(--serif);font-weight:700;font-size:36px;line-height:1.1;margin:0;letter-spacing:-.005em}
  .hello em{font-style:normal;color:var(--accent2);text-shadow:0 0 24px rgba(139,92,246,.45)}
  .prog{display:flex;align-items:center;gap:12px;margin-top:18px;max-width:460px}
  .bar{flex:1;height:8px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;
    box-shadow:0 0 12px rgba(139,92,246,.7);transition:width .35s ease}
  .count{font-size:14px;color:var(--muted);white-space:nowrap}
  .count b{color:var(--text);font-weight:700}
  .hero .upd-m{color:var(--dim);font-size:12.5px;margin-top:8px}
  .hero .upd-m bdi{color:var(--muted)}

  /* shortcuts */
  .quick{padding:18px 16px 16px;margin-bottom:14px}
  .qrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .qbtn{appearance:none;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;
    color:var(--muted);font-size:12.5px;font-weight:600;line-height:1.2;text-align:center;padding:2px 0;-webkit-tap-highlight-color:transparent}
  .ring{--c:var(--accent);width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--c);
    background:radial-gradient(circle,color-mix(in srgb,var(--c) 18%,transparent),color-mix(in srgb,var(--c) 6%,transparent) 70%);
    box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 70%,transparent),0 0 18px -4px color-mix(in srgb,var(--c) 60%,transparent);transition:transform .15s,box-shadow .15s}
  .ring .ico{width:22px;height:22px}
  .qbtn:hover .ring,.qbtn:focus-visible .ring{transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--c),0 0 24px -2px color-mix(in srgb,var(--c) 70%,transparent)}
  .qbtn:hover,.qbtn:focus-visible{color:var(--text);outline:none}
  .c-purple{--c:#8B5CF6}.c-green{--c:#34d399}.c-violet{--c:#d08cff}.c-orange{--c:#fb923c}.c-blue{--c:#60a5fa}.c-gray{--c:#8b90a8}

  /* stats */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{position:relative;overflow:hidden;padding:14px 16px 14px;min-height:108px;display:flex;flex-direction:column}
  .stat .k{font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
  .stat .v{font-size:38px;font-weight:800;line-height:1;margin-top:auto;padding-top:14px;color:var(--c,var(--text));font-variant-numeric:tabular-nums}
  .stat .s{font-size:12px;color:var(--dim);margin-top:6px}
  .stat .ghost{position:absolute;inset-inline-end:-6px;bottom:-22px;font-size:92px;font-weight:900;line-height:1;color:rgba(255,255,255,.035);
    letter-spacing:-.04em;pointer-events:none;font-variant-numeric:tabular-nums}
  .stat.alert{border-color:rgba(139,92,246,.35);background:radial-gradient(200px 120px at 100% 0%,rgba(139,92,246,.18),transparent 70%),linear-gradient(180deg,var(--card2),var(--card))}

  /* episode strip */
  .eps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 20px}
  .ep{display:grid;grid-template-columns:auto 1fr;column-gap:9px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-width:0}
  .ep span{grid-column:2}
  .ep i{width:9px;height:9px;border-radius:50%;background:var(--c,#666);box-shadow:0 0 0 3px color-mix(in srgb,var(--c,#666) 22%,transparent),0 0 10px var(--c,#666);flex:0 0 auto}
  .ep b{font-size:14.5px;font-weight:700;white-space:nowrap}
  .ep span{font-size:12.5px;color:var(--muted);line-height:1.35}

  /* sections */
  .sec-h{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
  .sec-h h2{font-family:var(--serif);font-size:24px;font-weight:700;margin:0}
  .grid{display:grid;gap:12px}
  .sec{padding:16px 14px 12px;scroll-margin-top:84px;transition:box-shadow .3s,border-color .3s}
  .sec-t{display:flex;align-items:center;gap:10px;margin:0 2px 12px;font-size:18px;font-weight:700;line-height:1.3}
  .sec-t .ring{width:36px;height:36px;flex:0 0 auto}
  .sec-t .ring .ico{width:17px;height:17px}
  .sec-t .n,details.sec summary .n{margin-right:auto;font-size:12.5px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.05);border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .sec.hot{border-color:rgba(139,92,246,.55);
    background:radial-gradient(360px 180px at 100% 0%,rgba(139,92,246,.24),transparent 70%),linear-gradient(180deg,#171430,#100f22);
    box-shadow:0 0 0 1px rgba(139,92,246,.18),0 18px 40px -18px rgba(139,92,246,.6)}
  .sec-t .tt{flex:1;min-width:0}
  .sec.hot .badge{display:block;width:fit-content;margin-bottom:4px;font-size:11px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--accent);border-radius:99px;padding:2px 9px;box-shadow:0 0 12px rgba(139,92,246,.6)}
  .sec.flash{box-shadow:0 0 0 2px var(--accent2),0 0 30px -4px rgba(139,92,246,.7)}

  ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  li[hidden]{display:none}
  label.task{display:flex;align-items:flex-start;gap:12px;padding:13px 12px;border-radius:14px;background:rgba(255,255,255,.028);border:1px solid var(--line);
    cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:54px;transition:background .15s,border-color .15s}
  label.task:hover{background:rgba(255,255,255,.045);border-color:var(--line2)}
  label.task input{position:absolute;opacity:0;pointer-events:none}
  .box{flex:0 0 26px;width:26px;height:26px;border-radius:8px;border:2px solid #444a66;display:grid;place-items:center;transition:.15s;margin-top:1px}
  .box svg{width:16px;height:16px;opacity:0;transform:scale(.6);transition:.15s}
  label.task input:checked + .box{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px rgba(139,92,246,.6)}
  label.task input:checked + .box svg{opacity:1;transform:none}
  label.task input:focus-visible + .box{outline:3px solid rgba(139,92,246,.6);outline-offset:2px}
  .txt{flex:1;min-width:0;font-size:16.5px;line-height:1.45;overflow-wrap:anywhere}
  .txt small{display:block;color:var(--muted);font-size:14px;margin-top:3px;line-height:1.45}
  label.task input:checked ~ .txt{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35);color:var(--muted)}
  mark{background:rgba(167,139,250,.28);color:inherit;border-radius:4px;padding:0 2px}

  details.sec summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;margin:0 2px;font-size:18px;font-weight:700}
  details.sec summary::-webkit-details-marker{display:none}
  details.sec summary .chev{color:var(--muted);transition:transform .2s;width:18px;height:18px}
  details.sec[open] summary .chev{transform:rotate(-90deg)}
  details.sec[open] ul{margin-top:12px}
  details.sec:not([open]){padding-bottom:16px;opacity:.75}
  .sec[hidden]{display:none}
  body.searching .hero,body.searching .quick,body.searching .stats,body.searching .eps{display:none}

  .track-h{display:flex;align-items:baseline;gap:10px;font-family:var(--serif);font-size:24px;margin:22px 2px 12px}
  .track-h small{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:500}
  .msg{padding:22px 16px;color:var(--muted);text-align:center}
  footer{color:var(--dim);font-size:12.5px;text-align:center;margin-top:24px}

  @media (max-width:360px){ .hello{font-size:31px} .stat .v{font-size:32px} .tile{font-size:10px} }

  /* ---------- desktop ---------- */
  @media (min-width:900px){
    body{font-size:17px}
    .app{display:grid;grid-template-columns:236px 1fr;align-items:start}
    .side{position:sticky;top:0;height:100vh;padding:22px 16px;border-inline-end:1px solid var(--line);background:linear-gradient(180deg,#0a0c17,#080911);
      display:flex;flex-direction:column;gap:22px}
    .brand{padding:4px 6px 18px;border-bottom:1px solid var(--line)}
    .tiles{position:static;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0;background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none}
    .tile{aspect-ratio:1/0.92;min-height:0;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:12.5px;gap:8px;color:var(--muted)}
    .tile .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.04)}
    .tile .ic .ico{width:20px;height:20px}
    .tile:hover{border-color:var(--line2);color:var(--text)}
    .tile[aria-current="true"]{border-color:rgba(167,139,250,.55);background:linear-gradient(180deg,rgba(139,92,246,.20),rgba(139,92,246,.06));box-shadow:0 0 22px -6px rgba(139,92,246,.6)}
    .tile[aria-current="true"] .ic{background:rgba(139,92,246,.25);color:#fff;box-shadow:inset 0 0 0 1px rgba(167,139,250,.55),0 0 14px rgba(139,92,246,.5)}
    .side-foot{margin-top:auto;color:var(--dim);font-size:12px;padding:0 6px;line-height:1.5}
    .main{padding:8px 28px 40px}
    .topbar{padding:16px 0 16px}
    .search{max-width:420px}
    .upd{display:block;margin-inline-start:auto}
    .hero{padding:34px 34px 30px}
    .hero .upd-m{display:none}
    .hello{font-size:46px}
    .quick{padding:20px 24px 20px}
    .qrow{display:flex;gap:30px}
    .qbtn{min-width:76px}
    .ring{width:58px;height:58px}
    .stats{grid-template-columns:repeat(4,1fr);gap:14px}
    .stat{min-height:124px;padding:18px 20px}
    .stat .v{font-size:44px}
    .stat .ghost{font-size:110px}
    .eps{display:flex;flex-wrap:wrap;gap:10px}
    .ep{display:flex;gap:10px;padding:10px 14px}
    .ep span{font-size:13px;white-space:nowrap}
    .grid{grid-template-columns:1fr 1fr;gap:14px;align-items:start}
    .grid .hot,.grid details.sec{grid-column:1/-1}
    .grid .hot ul{grid-template-columns:1fr 1fr}
  }
  @media (max-width:899px){ .side-foot{display:none} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="orb" aria-hidden="true"></span><div><b>פול <span>·</span> <bdi class="ltr" style="color:var(--accent2)">NIPO</bdi></b><small>לוח משימות</small></div></div>
    <nav class="tiles" id="tiles" aria-label="ניווט"></nav>
    <div class="side-foot">הסימונים נשמרים במכשיר הזה</div>
  </aside>

  <div class="main" id="top">
    <div class="topbar">
      <label class="search" aria-label="חיפוש משימה">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="חיפוש משימה..." autocomplete="off" enterkeyhint="search">
      </label>
      <div class="upd">עודכן: <bdi dir="ltr" class="updated">…</bdi></div>
    </div>

    <section class="card hero" id="dash">
      <p class="date" id="date">&nbsp;</p>
      <h1 class="hello"><span id="greet">בוקר טוב</span>, <em>פול</em></h1>
      <div class="prog" aria-label="התקדמות">
        <div class="bar"><i id="barFill"></i></div>
        <div class="count" id="count"></div>
      </div>
      <div class="upd-m">עודכן: <bdi dir="ltr" class="updated">…</bdi></div>
    </section>

    <section class="card quick" aria-label="קיצורים">
      <p class="label">קיצורים</p>
      <div class="qrow" id="quick"></div>
    </section>

    <section class="stats" aria-label="סיכום">
      <div class="card stat"><span class="k">משימות פתוחות</span><span class="v" id="stOpen">–</span><span class="s">בכל הרשימות</span><span class="ghost" aria-hidden="true">01</span></div>
      <div class="card stat alert" style="--c:var(--accent2)"><span class="k">חוסמות עכשיו</span><span class="v" id="stBlock">–</span><span class="s">חייבות לזוז קודם</span><span class="ghost" aria-hidden="true">02</span></div>
      <div class="card stat" style="--c:var(--green)"><span class="k">הושלמו</span><span class="v" id="stDone">–</span><span class="s" id="stDoneS">&nbsp;</span><span class="ghost" aria-hidden="true">03</span></div>
      <div class="card stat"><span class="k">פרקים בדרך</span><span class="v" id="stEps">–</span><span class="s">בהפקה</span><span class="ghost" aria-hidden="true">04</span></div>
    </section>

    <nav class="eps" id="eps" aria-label="סטטוס פרקים"></nav>

    <div class="sec-h"><h2>משימות</h2></div>
    <main id="tracks"><div class="card msg">טוען…</div></main>
    <div class="card msg" id="empty" hidden>לא נמצאו משימות שמתאימות לחיפוש</div>
    <footer>הסימונים נשמרים במכשיר הזה</footer>
  </div>
</div>

<script>
/* הנתונים נטענים מ-tasks.json (ראו AGENTS.md). אין לערוך נתונים כאן. */
const KEY = "paul-social-tasks-v1";
let DATA = null;

/* סימונים מקומיים של פול = דריסות מעל done שב-JSON.
   פורמט: {v:bool, base:bool} — base הוא ערך done ב-JSON ברגע הסימון.
   אם הסוכן שינה את done מאז, הדריסה מתבטלת וה-JSON קובע. ערך בוליאני ישן נשמר כמו שהוא. */
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };
const isDone = t => {
  const o = state[t.id], base = !!t.done;
  if (o === undefined) return base;
  if (typeof o === "boolean") return o;
  if (o && typeof o === "object" && o.base === base) return !!o.v;
  return base;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* טקסט לתצוגה: מבודד מספרים/טווחים (4–6, תאריכים) כדי שיוצגו נכון ב-RTL */
const txt = s => esc(s).replace(/(\d+(?:[–\-.:,/]\s?\d+)+)/g, '<bdi dir="ltr">$1</bdi>');
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const safeColor = c => /^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]+$/.test(c||"") ? c : "#666";

const I = p => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const ICONS = {
  grid:  I('<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>'),
  redo:  I('<path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7"/><path d="M20 4v4.7h-4.7"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.3"/><path d="M4 20v-4.7h4.7"/>'),
  bolt:  I('<path d="M13 2.5L4.5 13.5H12l-1 8 8.5-11H12z"/>'),
  cam:   I('<rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5l6-3.5v10l-6-3.5z"/>'),
  book:  I('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8.5 7.5h7M8.5 11h5"/>'),
  tune:  I('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>'),
  check: I('<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.8 2.8L16.3 9.5"/>'),
  dot:   I('<circle cx="12" cy="12" r="4"/>'),
  chev:  '<svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>'
};
/* מראה לכל מקטע לפי id (נופל לברירת מחדל אם יתווסף מקטע חדש) */
const SEC_LOOK = { now:["bolt","c-purple"], ep2:["cam","c-green"], ep0:["redo","c-blue"], gadi:["book","c-violet"], small:["tune","c-orange"], done:["check","c-gray"] };
const TILES = [
  {label:"לוח", icon:"grid", target:"dash"},
  {label:"פרק 0", icon:"redo", sec:"ep0"},
  {label:"פרק 1", icon:"bolt", sec:"now"},
  {label:"פרק 2", icon:"cam", sec:"ep2"},
  {label:"פרקים 4–7", icon:"book", sec:"gadi"},
  {label:"הושלם", icon:"check", sec:"done"},
];
const QUICK = [
  {label:"פרק 1", icon:"bolt", c:"c-purple", sec:"now"},
  {label:"פרק 2", icon:"cam", c:"c-green", sec:"ep2"},
  {label:"סיפורים לגדי", icon:"book", c:"c-violet", sec:"gadi"},
  {label:"החלטות", icon:"tune", c:"c-orange", sec:"small"},
];

/* ---------- זמן (Asia/Jerusalem) ---------- */
const TZ = "Asia/Jerusalem";
function fmtUpdated(iso){
  const d = new Date(iso);
  if (isNaN(d)) return iso ? String(iso) : "—";
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", {timeZone:TZ,
    day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit", hourCycle:"h23"})
    .formatToParts(d).map(x => [x.type, x.value]));
  return `${p.day}.${p.month}.${p.year} ${p.hour}:${p.minute}`;
}
function paintClock(){
  const now = new Date();
  const p = Object.fromEntries(new Intl.DateTimeFormat("he-IL", {timeZone:TZ, weekday:"long", day:"numeric", month:"long"})
    .formatToParts(now).map(x => [x.type, x.value]));
  document.getElementById("date").innerHTML = `${esc(p.weekday)} · <bdi dir="ltr">${esc(p.day)}</bdi> ${esc(p.month)}`;
  const h = +new Intl.DateTimeFormat("en-GB", {timeZone:TZ, hour:"2-digit", hourCycle:"h23"}).format(now);
  document.getElementById("greet").textContent =
    h >= 5 && h < 12 ? "בוקר טוב" : h >= 12 && h < 17 ? "צהריים טובים" : h >= 17 && h < 22 ? "ערב טוב" : "לילה טוב";
}

/* ---------- רינדור ---------- */
function taskHTML(t){
  const hay = `${t.text||""} ${t.note||""}`.toLowerCase();
  return `<li data-hay="${esc(hay)}"><label class="task"><input type="checkbox" data-id="${esc(t.id)}" data-base="${t.done?1:0}" ${isDone(t)?"checked":""}>
    <span class="box">${CHECK}</span>
    <span class="txt"><span class="t">${txt(t.text)}</span>${t.note?`<small>${txt(t.note)}</small>`:""}</span></label></li>`;
}
const isBlocking = s => !!s.highlight || /חוסם/.test(s.title||"");
function sectionHTML(tr, s){
  const sid = `${tr.id}-${s.id}`;
  const [ic, c] = SEC_LOOK[s.id] || ["dot","c-purple"];
  const list = `<ul>${(s.tasks||[]).map(taskHTML).join("")}</ul>`;
  const n = `<bdi dir="ltr" class="n" data-sec="${esc(sid)}"></bdi>`;
  const attrs = `id="sec-${esc(sid)}" data-s="${esc(s.id)}" data-title="${esc(s.title||"")}"`;
  if (s.collapsed) return `<details class="card sec" ${attrs}><summary>${ICONS.chev}<span class="ring ${c}" style="width:32px;height:32px">${ICONS[ic]}</span>${txt(s.title)}${n}</summary>${list}</details>`;
  const hot = s.highlight;
  return `<section class="card sec${hot?" hot":""}" ${attrs}><div class="sec-t"><span class="ring ${c}">${ICONS[ic]}</span><span class="tt">${hot?'<span class="badge">דחוף</span>':""}${txt(s.title)}</span>${n}</div>${list}</section>`;
}
const tracks = () => (DATA && DATA.tracks) || [];
const allTasks = () => tracks().flatMap(tr => (tr.sections||[]).flatMap(s => s.tasks||[]));

function findSection(key, label){
  let el = document.querySelector(`.sec[data-s="${CSS.escape(key)}"]`);
  if (!el && label) el = [...document.querySelectorAll(".sec")].find(x => x.dataset.title.includes(label));
  return el;
}
function go(item){
  const q = document.getElementById("q");
  if (q.value) { q.value = ""; applySearch(); }
  let el = item.target ? document.getElementById(item.target) : findSection(item.sec, item.label);
  if (!el) return;
  if (el.tagName === "DETAILS") el.open = true;
  const y = item.target ? 0 : el.getBoundingClientRect().top + scrollY - 76;
  scrollTo({top:y, behavior:"smooth"});
  if (!item.target) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400); }
  setActive(TILES.indexOf(item) >= 0 ? TILES.indexOf(item) : TILES.findIndex(t => t.sec === item.sec));
}
function setActive(i){ document.querySelectorAll(".tile").forEach((b, j) => b.setAttribute("aria-current", j === i)); }

function renderNav(){
  document.getElementById("tiles").innerHTML = TILES.map((t, i) =>
    `<button class="tile" type="button" data-i="${i}" aria-current="${i===0}"><span class="ic">${ICONS[t.icon]}</span><span>${txt(t.label)}</span></button>`).join("");
  document.getElementById("quick").innerHTML = QUICK.map((t, i) =>
    `<button class="qbtn" type="button" data-q="${i}"><span class="ring ${t.c}">${ICONS[t.icon]}</span><span>${txt(t.label)}</span></button>`).join("");
  document.getElementById("tiles").addEventListener("click", e => { const b = e.target.closest(".tile"); if (b) go(TILES[+b.dataset.i]); });
  document.getElementById("quick").addEventListener("click", e => { const b = e.target.closest(".qbtn"); if (b) go(QUICK[+b.dataset.q]); });
}

function render(){
  if (!DATA) return;
  document.querySelectorAll(".updated").forEach(el => el.textContent = fmtUpdated(DATA.updated));
  const eps = DATA.episodes || [];
  document.getElementById("eps").innerHTML = eps.map(e =>
    `<div class="ep" style="--c:${safeColor(e.color)}"><i></i><b>${txt(e.label)}</b><span>${txt(e.status)}</span></div>`).join("");
  document.getElementById("eps").hidden = !eps.length;
  const multi = tracks().length > 1;
  document.getElementById("tracks").innerHTML = tracks().map(tr => `<div class="track" id="track-${esc(tr.id)}">
      ${multi ? `<h2 class="track-h">${txt(tr.title)}${tr.owner?`<small>${txt(tr.owner)}</small>`:""}</h2>` : ""}
      <div class="grid">${(tr.sections||[]).map(s => sectionHTML(tr, s)).join("")}</div>
    </div>`).join("") || `<div class="card msg">אין משימות</div>`;
  update();
  applySearch();
  spy();
}
function update(){
  if (!DATA) return;
  const all = allTasks();
  const done = all.filter(isDone).length;
  const blocking = tracks().flatMap(tr => (tr.sections||[]).filter(isBlocking).flatMap(s => s.tasks||[])).filter(t => !isDone(t)).length;
  document.getElementById("barFill").style.width = (all.length ? done/all.length*100 : 0) + "%";
  document.getElementById("count").innerHTML = `<bdi dir="ltr"><b>${done}</b>/${all.length}</bdi> בוצעו`;
  document.getElementById("stOpen").textContent = all.length - done;
  document.getElementById("stBlock").textContent = blocking;
  document.getElementById("stDone").textContent = done;
  document.getElementById("stDoneS").innerHTML = `מתוך <bdi dir="ltr">${all.length}</bdi> משימות`;
  document.getElementById("stEps").textContent = (DATA.episodes||[]).length;
  tracks().forEach(tr => (tr.sections||[]).forEach(s => {
    const el = document.querySelector(`[data-sec="${CSS.escape(tr.id+"-"+s.id)}"]`);
    const ts = s.tasks||[];
    if (el) el.textContent = `${ts.filter(isDone).length}/${ts.length}`;
  }));
}

/* ---------- חיפוש חי ---------- */
function applySearch(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  document.body.classList.toggle("searching", !!q);
  let any = false;
  document.querySelectorAll(".sec").forEach(sec => {
    let n = 0;
    sec.querySelectorAll("li").forEach(li => { const hit = !q || li.dataset.hay.includes(q); li.hidden = !hit; if (hit) n++; });
    sec.hidden = q && !n;
    if (sec.tagName === "DETAILS") { if (q && n) { if (!sec.dataset.was) sec.dataset.was = sec.open ? "1" : "0"; sec.open = true; }
      else if (!q && sec.dataset.was) { sec.open = sec.dataset.was === "1"; delete sec.dataset.was; } }
    if (n) any = true;
  });
  document.getElementById("empty").hidden = !q || any || !DATA;
}
document.getElementById("q").addEventListener("input", applySearch);

/* ---------- הדגשת האריח הפעיל בגלילה ---------- */
let io;
function spy(){
  if (!("IntersectionObserver" in window)) return;
  if (io) io.disconnect();
  const map = new Map();
  TILES.forEach((t, i) => { const el = t.target ? document.getElementById(t.target) : findSection(t.sec, t.label); if (el) map.set(el, i); });
  const vis = new Set();
  io = new IntersectionObserver(es => {
    es.forEach(e => e.isIntersecting ? vis.add(e.target) : vis.delete(e.target));
    let best = null, bt = Infinity;
    vis.forEach(el => { const t = Math.abs(el.getBoundingClientRect().top - 80); if (t < bt) { bt = t; best = el; } });
    if (best) setActive(map.get(best));
  }, {rootMargin:"-70px 0px -45% 0px"});
  map.forEach((_, el) => io.observe(el));
}

document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (!id) return;
  const base = e.target.dataset.base === "1";
  if (e.target.checked === base) delete state[id];
  else state[id] = { v: e.target.checked, base };
  save();
  document.querySelectorAll(`input[data-id="${CSS.escape(id)}"]`).forEach(i => { if (i !== e.target) i.checked = e.target.checked; });
  update();
});

renderNav();
paintClock();
setInterval(paintClock, 60000);
fetch("tasks.json", {cache:"no-store"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { DATA = d; render(); })
  .catch(err => {
    document.getElementById("tracks").innerHTML = `<div class="card msg">לא הצלחתי לטעון את המשימות (${esc(err.message)}). נסו לרענן.</div>`;
  });
</script>
</body>
</html>
